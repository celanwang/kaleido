name: prepare release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching pyproject.toml (new tag only)"
        required: true
        default: "v1.0.0"
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main, matching version and a fresh tag
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != "v" + version:
              raise SystemExit("tag must equal the checked-out project version")
          PY
          if git rev-parse --verify "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists; refusing to overwrite it."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv run --locked --all-extras python -m kaleido doctor
      - run: uv run --locked --all-extras python -m kaleido verify --deep
      - run: uv run --locked --all-extras ruff check .
      - run: uv run --locked --all-extras ruff format --check .
      - run: uv run --locked --all-extras pytest
      - run: uv run --locked --all-extras python -m kaleido reproduce --profile smoke
      - run: uv run --locked --all-extras python -m kaleido export --weights results/p3/reference/model-42.npz --tokenizer results/p3/reference/tokenizer.json --output runs/decoder-42
      - run: uv build
      - run: uv run --locked --all-extras python scripts/check_wheel.py --wheel dist/kaleido-1.0.0-py3-none-any.whl --bundle runs/decoder-42 --report runs/wheel-check.json
      - run: uv run --locked --all-extras kaleido package --wheel dist/kaleido-1.0.0-py3-none-any.whl --bundle runs/decoder-42 --output runs/kaleido-cpu-delivery
      - run: uv run --locked --all-extras python scripts/check_delivery.py --delivery runs/kaleido-cpu-delivery --report runs/delivery-check.json
      - name: Package assets and create an unpublished draft
        run: |
          cp runs/wheel-check.json dist/wheel-check.json
          cp runs/delivery-check.json dist/delivery-check.json
          python -c "import shutil; shutil.make_archive('dist/kaleido-cpu-delivery', 'zip', 'runs', 'kaleido-cpu-delivery')"
          (cd runs && zip -qr ../dist/decoder-42.zip decoder-42)
          (cd dist && sha256sum *.whl *.tar.gz *.zip wheel-check.json delivery-check.json > SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*.zip dist/wheel-check.json dist/delivery-check.json dist/SHA256SUMS --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"

name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv run --locked --all-extras ruff check .
      - run: uv run --locked --all-extras ruff format --check .
      - run: uv run --locked --all-extras pytest
      - run: uv run --locked --all-extras python -m kaleido.demos.linear_regression
      - run: uv run --locked --all-extras python -m kaleido.demos.classical_ml

[project]
name = "kaleido"
version = "0.1.0"
description = "Machine learning mechanisms through reproducible experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
]

[project.optional-dependencies]
reference = [
    "scikit-learn==1.9.1",
]
torch-reference = [
    "torch==2.14.1",
]
posttrain = [
    "huggingface-hub==2.2.0",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "transformers==5.20.1",
]

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/kaleido"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
